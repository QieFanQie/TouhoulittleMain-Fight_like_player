plugins {
    id 'eclipse'
    id 'idea'
    // 版本固定为 6.0.54：本机 Gradle 缓存已有该版本，可离线构建
    // （动态版本 [6.0.16,6.2) 会联网刷新元数据，在本机网络下会长时间卡住）
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = mod_group_id
version = mod_version
base {
    archivesName = "${mod_id}-${minecraft_version}-forge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            jvmArgs = [
                    "-XX:+IgnoreUnrecognizedVMOptions",
                    "-XX:+AllowEnhancedClassRedefinition"
            ]
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
        }
        server {
            args '--nogui'
        }
    }
}

repositories {
    // 本地前置：libs/touhoulittlemaid-1.5.3-forge+mc1.20.1.jar
    flatDir {
        dir 'libs'
    }
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 车万女仆：编译期与运行期都用本地 jar（离线可用、版本与验收实例一致）
    compileOnly fg.deobf("libs:touhoulittlemaid:${tlm_version}")
    runtimeOnly fg.deobf("libs:touhoulittlemaid:${tlm_version}")

    // ─────────────────────────────────────────────────────────────
    // ★ 联动模组：**一律只 compileOnly，绝不 runtimeOnly**
    //
    // 为什么只 compileOnly：我们的模组必须在【没装】这些模组时也能正常加载。
    // ⇒ 所有触碰它们类型的代码都放在 ModList.isLoaded(...) 守卫之后的**独立类**里，
    //   这样类加载是惰性的，未装时那些类根本不会被加载（与 @LittleMaidExtension 同一手法）。
    //
    // ⚠️ 绝不要写 runtimeOnly：那会让"未装该模组"的场景在开发环境里永远测不出来。
    //
    // jar 来自验收实例，文件名已改成纯 ASCII（PowerShell 把 [] 当通配符，路径会解析失败）。
    // ─────────────────────────────────────────────────────────────
    compileOnly fg.deobf("libs:goety:2.5.56.5")
    compileOnly fg.deobf("libs:irons_spellbooks:1.20.1-3.16.3")
    compileOnly fg.deobf("libs:slashblade:1.20.1-1.9.65")
    // ★ TaCZ（永恒枪械工坊：零）【已撤掉】——
    //    它曾被引入，唯一目的是枪托近战 tacz:melee 直调 `IGunOperator#melee()`。
    //    2026-10-01 委托方按「优先选稳定、无风险」拍板撤掉：实测 TaCZ 的 mods.toml 许可是
    //    `GPL3 / CC BY-NC-ND 4.0`（具传染性），而这一条动作只值 1/77。
    //    ⇒ 开火那条路**不受影响**：它走 TLM 的公开抽象 GunCommonUtil（零新依赖）。
    //    ⇒ 若将来重新引入，必须先在 THIRD_PARTY_NOTICES 里把这笔许可账记清。
    // Curios：铁魔法/Goety 的饰品槽依赖它；W5（饰品枚举）会用到
    // ⚠️ 文件名【不能】含 "+"（如 5.14.1+1.20.1）—— 会让 ForgeGradle 的 deobf 解析失败：
    //    "Could not find libs:curios:5.14.1+1.20.1"。已重命名为 curios-forge-5.14.1.jar。
    compileOnly fg.deobf("libs:curios:5.14.1")
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            tlm_version_range      : tlm_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// ─────────────────────────────────────────────────────────────
// ★ M3：把清单（catalog/）打进 jar 的内置数据包。
//
// 为什么必须做：catalog/ 在仓库根，**不在 src/main/resources** ⇒ 默认不会进 jar
// ⇒ 运行时（游戏里）根本读不到清单。而清单是决策层的燃料。
//
// 做法：复制到 data/<modid>/catalog/ 下 —— 这是一个**标准的原版数据包路径**，
// 因此数据包作者可以覆盖任意一个文件（资源包优先级：后者覆盖前者）。
// ⇒ 单一真相来源仍是仓库根的 catalog/，**不存在两份需要同步的副本**（构建期生成）。
processResources {
    from("${projectDir}/catalog/data") {
        into "data/${mod_id}/catalog"
        include "*.json"
    }
    // ★ 顶层清单文件：carriers.json（载体规则）· vectors.json（★ 评分表）· executors.json（执行器映射）
    from("${projectDir}/catalog") {
        into "data/${mod_id}/catalog"
        include "*.json"
    }
    // 清单改了就要重新打包
    inputs.dir("${projectDir}/catalog")
}

jar {
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
